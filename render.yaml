services:
  - type: web
    name: marketplace-masculinidade
    plan: free            # troca para "starter" se quiseres always-on + disco persistente
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
